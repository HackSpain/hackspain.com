<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none" width="100%" height="100%" preserveAspectRatio="xMidYMax meet" focusable="false" aria-hidden="true">
  <!-- Tower: whitewashed and tapered, the way they stand on the Consuegra ridge. -->
  <path
    d="M48 300 C50 222 58 142 68 98 L132 98 C142 142 150 222 152 300 Z"
    fill="var(--color-hs-cream)"
    stroke="var(--color-hs-ink)"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <!-- Conical roof -->
  <path
    d="M52 98 L100 36 L148 98 Z"
    fill="var(--color-hs-ink)"
    stroke="var(--color-hs-ink)"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <!-- Eave -->
  <path
    d="M50 98 H150"
    stroke="var(--color-hs-ink)"
    stroke-width="7"
    stroke-linecap="round"
  />
  <!-- Brand stripe under the eave -->
  <path
    d="M62 116 C90 111 112 111 138 116"
    stroke="var(--color-hs-orange)"
    stroke-width="9"
    stroke-linecap="round"
  />
  <!-- Windows -->
  <rect
    x="76" y="168" width="17" height="20" rx="2"
    fill="var(--color-hs-ink)"
  />
  <rect
    x="112" y="150" width="17" height="20" rx="2"
    fill="var(--color-hs-ink)"
  />
  <!-- Arched door -->
  <path
    d="M86 300 V262 C86 250 114 250 114 262 V300 Z"
    fill="var(--color-hs-ink)"
  />
  <!-- Sail axle, which the sails sit over -->
  <circle cx="100" cy="70" r="9" fill="var(--color-hs-ink)" />
</svg>
